spring:
  application:
    name: ECOM-CART-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/ecomcartdb
    username: root
    password: Deepak@87083

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8085

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:EcomInternalSecret2026}

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

# Application Information
info:
  app:
    name: ECOM-CART-SERVICE
    description: Ecommerce Cart Microservice
    version: 1.0.0